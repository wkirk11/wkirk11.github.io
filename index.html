<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Weston Kirk</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.4/css/academicons.min.css" />
  <style>
    /* --- PAGE BACKGROUND --- */
    html, body { min-height: 100%; }
    * { box-sizing: border-box; }

    body {
      font-family: 'Lora', serif;
      font-size: 1.5em;
      margin: 0;
      padding: 40px 40px 100px;
      overflow-x: hidden;
      background: url('background.png') center top / cover no-repeat;
      color: #111;
    }

    /* --- TOP CONTENT --- */
    .content-wrapper {
      position: relative;
      z-index: 10;
    }

    .text-content { max-width: 50%; text-align: left; }
    h1, h2 { margin: 0 0 12px; color: inherit; }
    p { margin: 0 0 12px; }

    a { color: #0a3ab9; text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* --- FLOWER BUTTON (bottom right, no label) --- */
    .leaf-button {
      position: fixed;
      bottom: 30px;
      right: 40px;
      z-index: 2000;
    }
    .leaf-button img {
      max-height: 140px;
      height: auto;
      cursor: pointer;
      transition: transform 0.2s ease;
      display: block;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3));
    }
    .leaf-button img:hover { transform: scale(1.05); }

    /* --- ICON ROW --- */
    .icon-bar {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 20px;
    }
    .icon-bar a {
      color: #fff;
      text-decoration: none;
      font-size: 1.5em;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,0.55));
      transition: transform 0.15s ease, opacity 0.15s ease;
      line-height: 1;
    }
    .icon-bar a:hover {
      transform: scale(1.15);
      opacity: 0.85;
      text-decoration: none;
    }

    /* --- HORIZON EASTER EGGS --- */
    .horizon-plant {
      position: fixed;
      z-index: 5;
      pointer-events: auto;
      display: none;
    }
    .horizon-plant img {
      opacity: 0.85;
      mix-blend-mode: multiply;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
      transition: opacity 0.3s ease;
    }
    .horizon-plant img:hover { opacity: 1; }

    .smoke-tree  { bottom: 34%; left: 2%; }
    .smoke-tree img  { height: 95px; }

    .madrone     { bottom: 34%; right: 2%; }
    .madrone img     { height: 105px; }

    .mtn-pink    { bottom: 30%; left: 47%; }
    .mtn-pink img    { height: 40px; }

    /* --- LIGHT TEXT THEME --- */
    .theme-white { color: #ffffff; }
    .theme-white h1,
    .theme-white h2,
    .theme-white p,
    .theme-white a {
      text-shadow: 0 1px 3px rgba(0,0,0,0.45);
    }
    .theme-white a { color: #e6f0ff; }
    .theme-white a:hover { text-decoration: underline; }
  </style>
</head>
<body class="theme-white">
  <div class="content-wrapper">
    <div class="text-content">
      <h1>Weston Kirk</h1>
      <p>
        I am a student at Stanford studying Mathematics (BS), Earth Systems (BS), and Computer Science (MS).
        Click on the flower to see some of my projects and research.
      </p>
      <div class="icon-bar">
        <a href="wk_cv_2026.pdf" target="_blank" rel="noopener" title="CV">
          <i class="fas fa-file-lines"></i>
        </a>
        <a href="https://scholar.google.com/citations?user=KWA9VuIAAAAJ&hl=en" target="_blank" rel="noopener" title="Google Scholar">
          <i class="ai ai-google-scholar"></i>
        </a>
        <a href="mailto:wkirk@stanford.edu" title="Email">
          <i class="fas fa-envelope"></i>
        </a>
        <a href="https://www.linkedin.com/in/weston-kirk-5a880a244" target="_blank" rel="noopener" title="LinkedIn">
          <i class="fab fa-linkedin"></i>
        </a>
      </div>
    </div>
  </div>

  <!-- Horizon easter eggs — commented out until positioning is refined
  <div class="horizon-plant smoke-tree">
    <img src="images/smoke_tree_branch.png" alt="" title="Cotinus obovatus — my favorite tree" />
  </div>
  <div class="horizon-plant madrone">
    <img src="images/madrone_two_berries.png" alt="" title="Arbutus menziesii — Pacific madrone" />
  </div>
  <div class="horizon-plant mtn-pink">
    <img src="images/mountain_pink.png" alt="" title="Centaurium beyrichii — mountain pink" />
  </div>
  -->

  <script>
    if (localStorage.getItem('visitedProjects')) {
      document.querySelectorAll('.horizon-plant').forEach(el => el.style.display = 'block');
    }
  </script>

  <!-- Flower button, bottom right, no label -->
  <div class="leaf-button">
    <a href="future.html">
      <img src="images/milkweed_vine_bloom_2.png" alt="Projects and Research" />
    </a>
  </div>

</body>
</html>
