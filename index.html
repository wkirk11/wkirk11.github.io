<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Weston Kirk</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora&display=swap" rel="stylesheet" />
  <style>
    :root { --bottom-bar-h: 200px; }
    @media (max-height: 700px) { :root { --bottom-bar-h: 160px; } }
    @media (max-height: 520px) { :root { --bottom-bar-h: 130px; } }

    /* --- PAGE BACKGROUND --- */
    html, body { height: 100%; }
    body {
      font-family: 'Lora', serif;
      font-size: 1.5em;
      margin: 0;
      /* restore original top spacing; keep bottom safe area */
      padding: 40px 40px calc(var(--bottom-bar-h) + 20px);
      overflow-x: hidden;

      /* background image, continuous, no fades/boxes */
      background: url('background.png') center top / cover no-repeat fixed;
      color: #111; /* default (overridden by .theme-white below) */
    }

    /* Keep content above background */
    .content-wrapper, .bottom-bar { position: relative; z-index: 10; }

    /* --- TOP CONTENT --- */
    .content-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
    }

    .text-content { max-width: 50%; text-align: left; }
    h1, h2 { margin: 0 0 12px; color: inherit; }
    p { margin: 0 0 12px; }

    /* Readability without any white box */
    h1, h2, p, a, .corner-button-label, .button-label {
      text-shadow: 0 1px 1px rgba(255,255,255,0.0);
    }

    a { color: #0a3ab9; text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* --- PROJECT IMAGE BUTTON --- */
    .leaf-button img {
      max-height: 280px;
      height: auto;
      cursor: pointer;
      transition: transform 0.2s ease;
      display: block;
    }
    .leaf-button img:hover { transform: scale(1.05); }
    .button-label, .corner-button-label {
      text-align: center; margin-top: 10px; font-size: 1em; color: inherit; white-space: nowrap;
    }

    /* --- BOTTOM FIXED BUTTONS (no fade) --- */
    .bottom-bar {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      height: var(--bottom-bar-h);
      padding: 0 40px 12px;
      display: flex; justify-content: space-between; align-items: flex-end;
      background: transparent;
      z-index: 2000;
      pointer-events: auto;
    }
    .bottom-bar .buttons {
      width: 100%;
      display: flex; justify-content: space-between; align-items: flex-end;
      gap: 24px; flex-wrap: nowrap;
    }

    .corner-button {
      display: flex; flex-direction: column; align-items: center;
      margin: 10px; cursor: pointer;
    }
    .corner-button img {
      max-width: 100%; height: auto;
      max-height: min(140px, calc(var(--bottom-bar-h) - 40px));
      transition: transform 0.3s ease;
      display: block;
    }
    .corner-button img:hover { transform: rotate(10deg) scale(1.1); }

    /* --- LIGHT TEXT THEME (white text + black shadow) --- */
    .theme-white { color: #ffffff; }
    .theme-white h1,
    .theme-white h2,
    .theme-white p,
    .theme-white a,
    .theme-white .corner-button-label,
    .theme-white .button-label {
      text-shadow: 0 1px 3px rgba(0,0,0,0.45);
    }
    .theme-white a { color: #e6f0ff; }
    .theme-white a:hover { text-decoration: underline; }
  </style>
</head>
<body class="theme-white">
  <div class="content-wrapper">
    <div class="text-content">
      <h1>Weston Kirk</h1>
      <p>
        I'm an undergraduate at Stanford studying Earth Systems, Math, and Computer Science.
        Currently, I work in the STAIR Lab as an undergraduate researcher.
      </p>

      <h2>Contact</h2>
      <p><a href="https://wkirk11.github.io/wk_resume_august_2025.pdf" target="_blank">View my CV (PDF)</a></p>
      <p><a href="mailto:wkirk@stanford.edu">wkirk@stanford.edu</a></p>
      <p><a href="https://www.linkedin.com/in/weston-kirk-5a880a244" target="_blank">weston-kirk-5a880a244</a></p>
    </div>

    <div class="leaf-button">
      <a href="projects.html" target="_blank">
        <img id="treeImage" src="smoke_tree_branch.png" alt="Enter site via leaf image" />
      </a>
      <p class="button-label">Projects</p>
    </div>
  </div>

  <!-- Fixed Bottom Buttons -->
  <div class="bottom-bar">
    <div class="buttons">
      <a class="corner-button clematis-button" href="clematis.html" title="Explore the Clematis">
        <img id="clematisImage" src="clematis_seeds.png" alt="Clematis Button" />
        <p class="corner-button-label">About Me</p>
      </a>

      <a class="corner-button mystery-button" href="future.html" title="Future Work">
        <img id="mysteryImage" src="milkweed_vine_bloom_2.png" alt="Mystery Button" />
        <p class="corner-button-label">Research</p>
      </a>
    </div>
  </div>
</body>
</html>
