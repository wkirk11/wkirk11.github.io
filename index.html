<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Weston Kirk</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora&display=swap" rel="stylesheet" />
  <style>
    /* --- Responsive bottom bar size --- */
    :root { --bottom-bar-h: 260px; }
    @media (max-height: 700px) { :root { --bottom-bar-h: 200px; } }
    @media (max-height: 520px) { :root { --bottom-bar-h: 160px; } }
    @media (max-height: 420px) { :root { --bottom-bar-h: 130px; } }

    /* --- PAGE BACKGROUND --- */
    html, body { min-height: 100%; }
    * { box-sizing: border-box; }

    body {
      font-family: 'Lora', serif;
      font-size: 1.5em;
      margin: 0;
      padding: 40px 40px calc(var(--bottom-bar-h) + env(safe-area-inset-bottom, 0px) + 20px);
      overflow-x: hidden;
      background: url('background.png') center top / cover no-repeat;
      color: #111;
    }

    .content-wrapper, .bottom-bar { position: relative; z-index: 10; }

    /* --- TOP CONTENT --- */
    .content-wrapper {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
    }

    .text-content { max-width: 50%; text-align: left; }
    h1, h2 { margin: 0 0 12px; color: inherit; }
    p { margin: 0 0 12px; }

    h1, h2, p, a, .corner-button-label, .button-label {
      text-shadow: 0 1px 1px rgba(255,255,255,0.0);
    }

    a { color: #0a3ab9; text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* --- PROJECT IMAGE BUTTON --- */
    .leaf-button img {
      max-height: 140px;
      height: auto;
      cursor: pointer;
      transition: transform 0.2s ease;
      display: block;
    }
    .leaf-button img:hover { transform: scale(1.05); }
    .button-label {
      text-align: center; margin-top: 10px; font-size: 1em; color: inherit; white-space: nowrap;
    }

    /* --- BOTTOM CONTACT BAR --- */
    .bottom-bar {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      height: var(--bottom-bar-h);
      padding: 0 40px calc(16px + env(safe-area-inset-bottom, 0px));
      display: flex; align-items: flex-end;
      background: transparent;
      z-index: 2000;
      pointer-events: auto;
    }
    .contact-links {
      display: flex;
      flex-direction: row;
      gap: 40px;
      align-items: center;
      font-size: 1em;
    }
    .contact-links a, .contact-links span {
      color: #fff;
      text-decoration: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
      white-space: nowrap;
    }
    .contact-links a:hover { text-decoration: underline; }

    /* --- LIGHT TEXT THEME --- */
    .theme-white { color: #ffffff; }
    .theme-white h1,
    .theme-white h2,
    .theme-white p,
    .theme-white a,
    .theme-white .corner-button-label,
    .theme-white .button-label {
      text-shadow: 0 1px 3px rgba(0,0,0,0.45);
    }
    .theme-white a { color: #e6f0ff; }
    .theme-white a:hover { text-decoration: underline; }
  </style>
</head>
<body class="theme-white">
  <div class="content-wrapper">
    <div class="text-content">
      <h1>Weston Kirk</h1>
      <p>
        I'm an undergraduate at Stanford studying Earth Systems, Math, and Computer Science.
        Currently, I work in the STAIR Lab as an undergraduate researcher.
      </p>
    </div>

    <div class="leaf-button">
      <a href="future.html">
        <img id="researchImage" src="images/milkweed_vine_bloom_2.png" alt="Research Button" />
      </a>
      <p class="button-label">Research</p>
    </div>
  </div>

  <!-- Fixed Bottom Contact Bar -->
  <div class="bottom-bar">
    <div class="contact-links">
      <a href="wk_cv_october_2025.pdf" target="_blank" rel="noopener">CV</a>
      <span>wkirk 'at' stanford 'dot' edu</span>
      <a href="https://www.linkedin.com/in/weston-kirk-5a880a244" target="_blank" rel="noopener">LinkedIn</a>
    </div>
  </div>
</body>
</html>
